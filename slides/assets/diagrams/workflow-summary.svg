<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="350" viewBox="0 0 1230 350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect width="1230" height="350" fill="#ffffff"/>

  <rect x="244" y="10" width="742" height="258" rx="16" fill="#f5f9ff" stroke="#1e88e5" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="264" y="38" font-size="13" fill="#1565c0" font-weight="bold" letter-spacing="1">PLANNING STAGE</text>
  <text x="966" y="38" font-size="13" fill="#555" text-anchor="end">One version-controlled specification</text>

  <rect x="10" y="56" width="210" height="190" rx="12" fill="#f5f5f5" stroke="#757575" stroke-width="2.5"/>
  <rect x="26" y="72" width="98" height="24" rx="12" fill="#757575"/>
  <text x="75" y="89" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1" text-anchor="middle">SCHEDULED</text>
  <text x="26" y="128" font-size="22" fill="#424242" font-weight="bold">Extract</text>
  <line x1="26" y1="142" x2="204" y2="142" stroke="#757575" stroke-width="1.5" opacity="0.5"/>
  <text x="26" y="168" font-size="14" fill="#222">Regular EDC extraction</text>
  <text x="26" y="188" font-size="14" fill="#222">in ODM format gives a</text>
  <text x="26" y="208" font-size="14" fill="#222">versioned source</text>

  <line x1="222" y1="151" x2="273" y2="151" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="276" y="56" width="210" height="190" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
  <rect x="292" y="72" width="98" height="24" rx="12" fill="#1e88e5"/>
  <text x="341" y="89" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1" text-anchor="middle">AI AGENT</text>
  <text x="292" y="128" font-size="22" fill="#1565c0" font-weight="bold">Draft</text>
  <line x1="292" y1="142" x2="470" y2="142" stroke="#1e88e5" stroke-width="1.5" opacity="0.5"/>
  <text x="292" y="168" font-size="14" fill="#222">Drafts the study</text>
  <text x="292" y="188" font-size="14" fill="#222">specification from the</text>
  <text x="292" y="208" font-size="14" fill="#222">template, adding only</text>
  <text x="292" y="228" font-size="14" fill="#222">study differences</text>

  <line x1="488" y1="151" x2="507" y2="151" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="510" y="56" width="210" height="190" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <rect x="526" y="72" width="110" height="24" rx="12" fill="#43a047"/>
  <text x="581" y="89" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1" text-anchor="middle">PEOPLE + AI</text>
  <text x="526" y="128" font-size="22" fill="#2e7d32" font-weight="bold">Review</text>
  <line x1="526" y1="142" x2="704" y2="142" stroke="#43a047" stroke-width="1.5" opacity="0.5"/>
  <text x="526" y="168" font-size="14" fill="#222">Check derivations and</text>
  <text x="526" y="188" font-size="14" fill="#222">verifications in yamaa,</text>
  <text x="526" y="208" font-size="14" fill="#222">where fixes are cheap</text>

  <line x1="722" y1="151" x2="741" y2="151" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="744" y="56" width="210" height="190" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <rect x="760" y="72" width="98" height="24" rx="12" fill="#43a047"/>
  <text x="809" y="89" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1" text-anchor="middle">PEOPLE</text>
  <text x="760" y="128" font-size="22" fill="#2e7d32" font-weight="bold">Finalize</text>
  <line x1="760" y1="142" x2="938" y2="142" stroke="#43a047" stroke-width="1.5" opacity="0.5"/>
  <text x="760" y="168" font-size="14" fill="#222">Approve and tag the</text>
  <text x="760" y="188" font-size="14" fill="#222">specification in version</text>
  <text x="760" y="208" font-size="14" fill="#222">control, with full lineage</text>

  <line x1="956" y1="151" x2="1007" y2="151" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="1010" y="56" width="210" height="190" rx="12" fill="#f5f5f5" stroke="#757575" stroke-width="2.5"/>
  <rect x="1026" y="72" width="98" height="24" rx="12" fill="#757575"/>
  <text x="1075" y="89" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1" text-anchor="middle">ENGINE</text>
  <text x="1026" y="128" font-size="22" fill="#424242" font-weight="bold">Automate</text>
  <line x1="1026" y1="142" x2="1204" y2="142" stroke="#757575" stroke-width="1.5" opacity="0.5"/>
  <text x="1026" y="168" font-size="14" fill="#222">Runs the specification</text>
  <text x="1026" y="188" font-size="14" fill="#222">on schedule in R or</text>
  <text x="1026" y="208" font-size="14" fill="#222">Python: identical SDTM,</text>
  <text x="1026" y="228" font-size="14" fill="#222">ADaM, and Define-XML</text>

  <path d="M1115,248 V300 H381 V250" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#ab)"/>
  <text x="748" y="328" font-size="15" fill="#1565c0" font-weight="bold" text-anchor="middle">Iterate while the study is ongoing</text>
