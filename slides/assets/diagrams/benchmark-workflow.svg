<text class="ts" x="294" y="207" dominant-baseline="central">Extraction</text>
<text class="ts" x="294" y="221" dominant-baseline="central">only</text>
<text class="ts" x="408" y="214" text-anchor="middle" dominant-baseline="central" fill="#888">output.json</text>
<text class="ts" x="488" y="214" text-anchor="middle" dominant-baseline="central" fill="#888">—</text>
