<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="462" viewBox="0 0 1280 462" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1280" height="462" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="30" font-size="24" font-weight="bold" fill="#222">An LLM is a probability model of the next token:  P<tspan font-size="16" dy="5">&#x3B8;</tspan><tspan dy="-5">(x</tspan><tspan font-size="16" dy="5">t</tspan><tspan dy="-5"> | x</tspan><tspan font-size="16" dy="5">&lt;t</tspan><tspan dy="-5">)</tspan></text>
  <text x="1260" y="30" font-size="15" text-anchor="end" fill="#777">Token splits, IDs and probabilities are illustrative</text>

  <!-- Step 1: raw prompt -->
  <text x="20" y="64" font-size="16" fill="#777">&#x2460; Prompt (text)</text>
  <rect x="20" y="74" width="350" height="42" rx="6" fill="#f5f5f5" stroke="#999"/>
  <text x="195" y="101" font-size="19" text-anchor="middle" fill="#222">"Thanksgiving is celebrated in"</text>
  <line x1="195" y1="116" x2="195" y2="148" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="207" y="138" font-size="15" fill="#666">tokenize</text>

  <!-- Step 2: tokens -->
  <text x="20" y="168" font-size="16" fill="#777">&#x2461; Tokens = context x&#x2264;5  (4 words &#x2192; 5 tokens)</text>
  <g font-size="17" text-anchor="middle">
    <rect x="20" y="178" width="104" height="68" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="72" y="200" fill="#1565c0" font-weight="bold">x&#x2081;</text>
    <text x="72" y="221" fill="#222">"Thanks"</text>
    <text x="72" y="239" font-size="15" fill="#666">id 9690</text>

    <rect x="132" y="178" width="104" height="68" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="184" y="200" fill="#1565c0" font-weight="bold">x&#x2082;</text>
    <text x="184" y="221" fill="#222">"giving"</text>
    <text x="184" y="239" font-size="15" fill="#666">id 13992</text>

    <rect x="244" y="178" width="104" height="68" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="296" y="200" fill="#1565c0" font-weight="bold">x&#x2083;</text>
    <text x="296" y="221" fill="#222">" is"</text>
    <text x="296" y="239" font-size="15" fill="#666">id 318</text>

    <rect x="356" y="178" width="104" height="68" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="408" y="200" fill="#1565c0" font-weight="bold">x&#x2084;</text>
    <text x="408" y="221" fill="#222" font-size="16">" celebrated"</text>
    <text x="408" y="239" font-size="15" fill="#666">id 13943</text>

    <rect x="468" y="178" width="104" height="68" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="520" y="200" fill="#1565c0" font-weight="bold">x&#x2085;</text>
    <text x="520" y="221" fill="#222">" in"</text>
    <text x="520" y="239" font-size="15" fill="#666">id 287</text>
  </g>
  <path d="M 24 252 L 24 260 L 232 260 L 232 252" fill="none" stroke="#d81b60" stroke-width="2"/>
  <text x="128" y="280" font-size="15" text-anchor="middle" fill="#d81b60" font-weight="bold">1 word "Thanksgiving" = 2 tokens</text>

  <!-- Step 3: model -->
  <line x1="574" y1="204" x2="606" y2="204" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="614" y="168" font-size="16" fill="#777">&#x2462; Trained model (given)</text>
  <rect x="610" y="178" width="208" height="68" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="714" y="206" font-size="22" text-anchor="middle" font-weight="bold" fill="#e65100">LLM</text>
  <text x="714" y="232" font-size="15" text-anchor="middle" fill="#666">&#x3B8; fixed (~10&#x2079;&#x2013;10&#xB9;&#xB2; params)</text>
  <line x1="820" y1="204" x2="852" y2="204" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 4: distribution -->
  <text x="900" y="64" font-size="16" fill="#777">&#x2463; Probability of every token in vocab (~100K)</text>
  <text x="900" y="92" font-size="18" font-weight="bold" fill="#222">P<tspan font-size="14" dy="4">&#x3B8;</tspan><tspan dy="-4">(x&#x2086; | x&#x2264;5)</tspan></text>
  <g font-size="16">
    <text x="1060" y="120" text-anchor="end" fill="#222">" November"</text>
    <rect x="1068" y="106" width="150" height="18" fill="#2e7d32"/>
    <text x="1224" y="120" fill="#222">0.81</text>

    <text x="1060" y="146" text-anchor="end" fill="#222">" the"</text>
    <rect x="1068" y="132" width="13" height="18" fill="#90a4ae"/>
    <text x="1087" y="146" fill="#222">0.07</text>

    <text x="1060" y="172" text-anchor="end" fill="#222">" America"</text>
    <rect x="1068" y="158" width="7" height="18" fill="#90a4ae"/>
    <text x="1081" y="172" fill="#222">0.04</text>

    <text x="1060" y="198" text-anchor="end" fill="#222">" October"</text>
    <rect x="1068" y="184" width="6" height="18" fill="#90a4ae"/>
    <text x="1080" y="198" fill="#222">0.03</text>

    <text x="1060" y="234" text-anchor="end" font-size="15" fill="#666">~100K others (incl. &#x27E8;EOS&#x27E9;)</text>
    <rect x="1068" y="220" width="9" height="18" fill="#cfd8dc"/>
    <text x="1083" y="234" fill="#666">0.05</text>
  </g>
  <line x1="1068" y1="100" x2="1068" y2="244" stroke="#999"/>

  <!-- Step 5: sample and loop -->
  <path d="M 1180 128 V 266 Q 1180 290 1156 290 H 675 Q 651 290 651 304" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arg)"/>
  <text x="1166" y="280" font-size="16" text-anchor="end" fill="#2e7d32" font-weight="bold">&#x2464; sample x&#x2086;, append to context</text>

  <text x="20" y="298" font-size="16" fill="#777">&#x2465; Repeat (append, predict next) until the end-of-sequence token</text>
  <g font-size="17" text-anchor="middle">
    <rect x="20" y="308" width="104" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="72" y="336">"Thanks"</text>
    <rect x="132" y="308" width="104" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="184" y="336">"giving"</text>
    <rect x="244" y="308" width="104" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="296" y="336">" is"</text>
    <rect x="356" y="308" width="104" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="408" y="336" font-size="16">" celebrated"</text>
    <rect x="468" y="308" width="104" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="520" y="336">" in"</text>
    <rect x="590" y="308" width="122" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="651" y="336" fill="#1b5e20" font-weight="bold">" November"</text>
    <rect x="722" y="308" width="74" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="759" y="336" fill="#1b5e20" font-weight="bold">"."</text>
    <rect x="806" y="308" width="112" height="44" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="862" y="336" fill="#b71c1c" font-weight="bold">&#x27E8;EOS&#x27E9;</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="651" y="372">x&#x2086;  p=0.81</text>
    <text x="759" y="372">x&#x2087;  p=0.58</text>
    <text x="862" y="372">x&#x2088;  p=0.85</text>
  </g>
  <line x1="920" y1="330" x2="958" y2="330" stroke="#c62828" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="962" y="310" width="92" height="40" rx="20" fill="#c62828"/>
  <text x="1008" y="336" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">STOP</text>
  <text x="1068" y="324" font-size="15" fill="#555">Output returned:</text>
  <text x="1068" y="346" font-size="17" fill="#222" font-weight="bold">"November."</text>

  <text x="20" y="404" font-size="16" fill="#222">Each step calls the same LLM on the growing context:  P<tspan font-size="14" dy="4">&#x3B8;</tspan><tspan dy="-4">(x&#x2086; | x&#x2264;5) &#x2192; P</tspan><tspan font-size="14" dy="4">&#x3B8;</tspan><tspan dy="-4">(x&#x2087; | x&#x2264;6) &#x2192; P</tspan><tspan font-size="14" dy="4">&#x3B8;</tspan><tspan dy="-4">(x&#x2088; | x&#x2264;7) &#x2192; &#x2026;</tspan></text>
  <text x="20" y="428" font-size="16" fill="#222"><tspan fill="#b71c1c" font-weight="bold">&#x27E8;EOS&#x27E9;</tspan> = special "end-of-sequence" token in the vocabulary; it gets a probability like any other token.</text>
  <text x="20" y="452" font-size="16" fill="#222">Generation stops when it is sampled <tspan fill="#666">(or when a max-token limit / user-defined stop sequence is reached).</tspan></text>
</svg>
