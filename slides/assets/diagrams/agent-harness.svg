<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="1280" height="450" fill="#ffffff"/>
  <text x="10" y="34" font-weight="bold"><tspan font-size="24" fill="#6a1b9a">Harness</tspan><tspan font-size="24" fill="#222"> = the software around the </tspan><tspan font-size="24" fill="#e65100">LLM</tspan><tspan font-size="24" fill="#222"> that turns its predictions into actions</tspan></text>
  <rect x="10" y="200" width="110" height="70" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="65" y="242" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">User</text>
  <rect x="178" y="86" width="722" height="354" rx="14" fill="#faf5fc" stroke="#8e24aa" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="198" y="113"><tspan font-size="18" fill="#6a1b9a">Harness</tspan><tspan font-size="16" fill="#6a1b9a">  e.g. OpenCode, Claude Code, Codex</tspan></text>
  <path d="M 122 235 L 194 235" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="150" y="225" font-size="15" fill="#222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">prompt</text>
  <rect x="198" y="132" width="232" height="150" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="314" y="160" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">&#x2460; Build the context</text>
  <text x="314" y="187" font-size="15" fill="#555" text-anchor="middle">system prompt &#xB7; AGENTS.md</text>
  <text x="314" y="210" font-size="15" fill="#555" text-anchor="middle">skills &#xB7; tool definitions</text>
  <text x="314" y="233" font-size="15" fill="#555" text-anchor="middle">history &#xB7; results &#xB7; memory</text>
  <text x="314" y="256" font-size="15" fill="#555" text-anchor="middle">compact it when it is full</text>
  <path d="M 432 207 L 462 207" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a3)"/>
  <rect x="466" y="142" width="170" height="130" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="551" y="172" font-size="17" fill="#e65100" text-anchor="middle" font-weight="bold">&#x2461; Call the LLM</text>
  <text x="551" y="205" text-anchor="middle"><tspan font-size="18" fill="#222">P</tspan><tspan font-size="15" fill="#222" dy="4">&#x3B8;</tspan><tspan font-size="18" fill="#222" dy="-4">(x</tspan><tspan font-size="15" fill="#222" dy="4">t</tspan><tspan font-size="18" fill="#222" dy="-4"> | x</tspan><tspan font-size="15" fill="#222" dy="4">&lt;t</tspan><tspan font-size="18" fill="#222" dy="-4">)</tspan></text>
  <text x="551" y="242" font-size="15" fill="#555" text-anchor="middle">text or a tool call</text>
  <path d="M 638 207 L 668 207" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a3)"/>
  <rect x="672" y="142" width="196" height="130" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="770" y="172" font-size="17" fill="#b71c1c" text-anchor="middle" font-weight="bold">&#x2462; Decide</text>
  <text x="770" y="200" font-size="15" fill="#555" text-anchor="middle">tool call &#x2192; run it</text>
  <text x="770" y="223" font-size="15" fill="#555" text-anchor="middle">answer &#x2192; stop</text>
  <text x="770" y="246" font-size="15" fill="#555" text-anchor="middle">limit or error &#x2192; stop</text>
  <path d="M 770 274 L 770 302" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="781" y="294" font-size="15" fill="#2e7d32" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">tool call</text>
  <rect x="606" y="306" width="274" height="96" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="743" y="333" font-size="17" fill="#1b5e20" text-anchor="middle" font-weight="bold">&#x2463; Run the tool</text>
  <text x="743" y="359" font-size="15" fill="#555" text-anchor="middle">permission: allow &#xB7; ask &#xB7; deny</text>
  <text x="743" y="382" font-size="15" fill="#555" text-anchor="middle">run it, capture output or error</text>
  <path d="M 604 354 L 314 354 L 314 286" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#a0)"/>
  <text x="459" y="345" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">result added to the context</text>
  <rect x="990" y="132" width="280" height="80" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
  <text x="1130" y="164" font-size="18" fill="#b45309" text-anchor="middle" font-weight="bold">Memory</text>
  <text x="1130" y="192" font-size="15" fill="#555" text-anchor="middle">knowledge graph</text>
  <path d="M 988 172 L 904 172" fill="none" stroke="#8e24aa" stroke-width="2.5" marker-end="url(#a4)" stroke-dasharray="7,5"/>
  <text x="946" y="162" font-size="15" fill="#8e24aa" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">retrieve</text>
  <path d="M 1130 214 L 1130 258" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a3)" marker-start="url(#a3)"/>
  <rect x="990" y="262" width="280" height="160" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1130" y="292" font-size="18" fill="#1b5e20" text-anchor="middle" font-weight="bold">Tools</text>
  <text x="1130" y="320" font-size="15" fill="#555" text-anchor="middle">search &#xB7; code &#xB7; APIs</text>
  <text x="1130" y="344" font-size="15" fill="#555" text-anchor="middle">e.g. read &#xB7; edit &#xB7; grep &#xB7; bash</text>
  <text x="1130" y="368" font-size="15" fill="#555" text-anchor="middle">files &#xB7; R &#xB7; Python &#xB7; opensas</text>
  <text x="1130" y="392" font-size="15" fill="#555" text-anchor="middle">only what the sandbox allows</text>
  <path d="M 882 330 L 986 330" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="934" y="320" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">action</text>
  <path d="M 988 376 L 884 376" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#a0)"/>
  <text x="934" y="397" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">output</text>
  <path d="M 770 140 L 770 70 L 65 70 L 65 196" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="420" y="62" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">final answer</text>
  <text x="539" y="426" font-size="15" fill="#6a1b9a" text-anchor="middle">guardrails and records: permissions &#xB7; hooks (lint, tests) &#xB7; a log of every action &#xB7; saved state</text>
</svg>
