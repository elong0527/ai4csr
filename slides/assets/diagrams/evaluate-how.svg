<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1280" height="448" fill="#ffffff"/>
  <text x="12" y="22" font-size="16" font-weight="bold" fill="#444">Rule-based, cheap, repeatable</text>
  <text x="1268" y="22" font-size="16" font-weight="bold" fill="#444" text-anchor="end">Judgment-based, costly, less repeatable</text>
  <line x1="12" y1="38" x2="1268" y2="38" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="12" y="54" width="396" height="384" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
  <text x="32" y="90" font-size="26" font-weight="bold" fill="#1565c0">Code-based</text>
  <line x1="32" y1="102" x2="388" y2="102" stroke="#1e88e5" stroke-width="1.5" opacity="0.5"/>
  <text x="32" y="126" font-size="15" font-weight="bold" fill="#999" letter-spacing="1">HOW</text>
  <text x="32" y="148" font-size="16" fill="#222">Multiple-choice and exact match,</text>
  <text x="32" y="168" font-size="16" fill="#222">schema checks, tests, cell compare</text>
  <text x="32" y="198" font-size="15" font-weight="bold" fill="#2e7d32" letter-spacing="1">PROS</text>
  <circle cx="40" cy="217" r="9" fill="#2e7d32"/>
  <text x="40" y="222.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="58" y="222" font-size="16" fill="#222">Deterministic and repeatable</text>
  <circle cx="40" cy="241" r="9" fill="#2e7d32"/>
  <text x="40" y="246.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="58" y="246" font-size="16" fill="#222">Cheap and fast</text>
  <text x="32" y="276" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">CONS</text>
  <circle cx="40" cy="295" r="9" fill="#c62828"/>
  <text x="40" y="300.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="58" y="300" font-size="16" fill="#222">Rejects valid alternatives</text>
  <circle cx="40" cy="319" r="9" fill="#c62828"/>
  <text x="40" y="324.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="58" y="324" font-size="16" fill="#222">Cannot judge subjective quality</text>
  <rect x="442" y="54" width="396" height="384" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="462" y="90" font-size="26" font-weight="bold" fill="#e65100">LLM-as-a-judge</text>
  <line x1="462" y1="102" x2="818" y2="102" stroke="#fb8c00" stroke-width="1.5" opacity="0.5"/>
  <text x="462" y="126" font-size="15" font-weight="bold" fill="#999" letter-spacing="1">HOW</text>
  <text x="462" y="148" font-size="16" fill="#222">Rubric, pairwise, or</text>
  <text x="462" y="168" font-size="16" fill="#222">reference-based scoring</text>
  <text x="462" y="198" font-size="15" font-weight="bold" fill="#2e7d32" letter-spacing="1">PROS</text>
  <circle cx="470" cy="217" r="9" fill="#2e7d32"/>
  <text x="470" y="222.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="488" y="222" font-size="16" fill="#222">Scales to open-ended output</text>
  <circle cx="470" cy="241" r="9" fill="#2e7d32"/>
  <text x="470" y="246.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="488" y="246" font-size="16" fill="#222">Explains its verdict</text>
  <text x="462" y="276" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">CONS</text>
  <circle cx="470" cy="295" r="9" fill="#c62828"/>
  <text x="470" y="300.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="488" y="300" font-size="16" fill="#222">Position, length, self-preference bias</text>
  <circle cx="470" cy="319" r="9" fill="#c62828"/>
  <text x="470" y="324.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="488" y="324" font-size="16" fill="#222">Non-deterministic</text>
  <circle cx="470" cy="343" r="9" fill="#c62828"/>
  <text x="470" y="348.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="488" y="348" font-size="16" fill="#222">Needs calibration against humans</text>
  <rect x="872" y="54" width="396" height="384" rx="14" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2.5"/>
  <text x="892" y="90" font-size="26" font-weight="bold" fill="#6a1b9a">Human review</text>
  <line x1="892" y1="102" x2="1248" y2="102" stroke="#ab47bc" stroke-width="1.5" opacity="0.5"/>
  <text x="892" y="126" font-size="15" font-weight="bold" fill="#999" letter-spacing="1">HOW</text>
  <text x="892" y="148" font-size="16" fill="#222">Expert review, spot checks,</text>
  <text x="892" y="168" font-size="16" fill="#222">adjudication</text>
  <text x="892" y="198" font-size="15" font-weight="bold" fill="#2e7d32" letter-spacing="1">PROS</text>
  <circle cx="900" cy="217" r="9" fill="#2e7d32"/>
  <text x="900" y="222.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="918" y="222" font-size="16" fill="#222">Gold standard for quality</text>
  <circle cx="900" cy="241" r="9" fill="#2e7d32"/>
  <text x="900" y="246.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="918" y="246" font-size="16" fill="#222">Catches what rubrics miss</text>
  <text x="892" y="276" font-size="15" font-weight="bold" fill="#c62828" letter-spacing="1">CONS</text>
  <circle cx="900" cy="295" r="9" fill="#c62828"/>
  <text x="900" y="300.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="918" y="300" font-size="16" fill="#222">Slow and costly</text>
  <circle cx="900" cy="319" r="9" fill="#c62828"/>
  <text x="900" y="324.5" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">&#x2212;</text>
  <text x="918" y="324" font-size="16" fill="#222">Reviewers can disagree</text>
  <line x1="32" y1="372" x2="388" y2="372" stroke="#1e88e5" stroke-width="1.5" opacity="0.5"/>
  <text x="32" y="396" font-size="15" font-weight="bold" fill="#385898" letter-spacing="1">IN THIS WORKSHOP</text>
  <text x="32" y="420" font-size="16" font-weight="bold" fill="#222">Harbor&apos;s verifier, cell by cell</text>
  <line x1="462" y1="372" x2="818" y2="372" stroke="#fb8c00" stroke-width="1.5" opacity="0.5"/>
  <text x="462" y="396" font-size="15" font-weight="bold" fill="#385898" letter-spacing="1">IN THIS WORKSHOP</text>
  <text x="462" y="420" font-size="16" font-weight="bold" fill="#222">Pilot 7&apos;s adjudication agent</text>
  <line x1="892" y1="372" x2="1248" y2="372" stroke="#ab47bc" stroke-width="1.5" opacity="0.5"/>
  <text x="892" y="396" font-size="15" font-weight="bold" fill="#385898" letter-spacing="1">IN THIS WORKSHOP</text>
  <text x="892" y="420" font-size="16" font-weight="bold" fill="#222">Benchmark and finding reviews</text>
</svg>
