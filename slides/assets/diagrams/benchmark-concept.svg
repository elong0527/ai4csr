<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="340" viewBox="0 0 1230 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1230" height="340" fill="#ffffff"/>

  <rect x="16" y="100" width="220" height="140" rx="12" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="36" y="138" font-size="24" fill="#17243b" font-weight="bold">Task</text>
  <line x1="36" y1="152" x2="216" y2="152" stroke="#cfd8dc" stroke-width="1.5"/>
  <text x="36" y="182" font-size="15" fill="#222">A derivation and</text>
  <text x="36" y="202" font-size="15" fill="#222">its input datasets</text>

  <path d="M238,170 H268 V85 H297" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M268,170 V255 H297" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="300" y="20" width="340" height="130" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
  <text x="320" y="48" font-size="13" fill="#1565c0" font-weight="bold" letter-spacing="1">PRODUCTION</text>
  <text x="320" y="82" font-size="24" fill="#1565c0" font-weight="bold">AI agent</text>
  <text x="320" y="112" font-size="15" fill="#222">Writes a program that produces</text>
  <text x="320" y="132" font-size="15" fill="#222">the output datasets</text>

  <rect x="300" y="190" width="340" height="130" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="320" y="218" font-size="13" fill="#2e7d32" font-weight="bold" letter-spacing="1">INDEPENDENT QC</text>
  <text x="320" y="252" font-size="24" fill="#2e7d32" font-weight="bold">Expected output</text>
  <text x="320" y="282" font-size="15" fill="#222">Authored independently of any</text>
  <text x="320" y="302" font-size="15" fill="#222">agent, then reviewed by people</text>

  <path d="M642,85 H680 V170 H717" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M642,255 H680 V170" fill="none" stroke="#444" stroke-width="2.5"/>

  <rect x="720" y="100" width="250" height="140" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2.5"/>
  <text x="740" y="128" font-size="13" fill="#6a1b9a" font-weight="bold" letter-spacing="1">COMPARE</text>
  <text x="740" y="162" font-size="24" fill="#6a1b9a" font-weight="bold">Grader</text>
  <text x="740" y="192" font-size="15" fill="#222">Compares every dataset,</text>
  <text x="740" y="212" font-size="15" fill="#222">cell by cell</text>

  <line x1="972" y1="170" x2="1017" y2="170" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="1020" y="100" width="194" height="140" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1040" y="138" font-size="24" fill="#1b5e20" font-weight="bold">Reward</text>
  <circle cx="1053" cy="174" r="13" fill="#2e7d32"/>
  <text x="1053" y="179" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
  <text x="1076" y="179" font-size="15" fill="#222">all match</text>
  <circle cx="1053" cy="210" r="13" fill="#c62828"/>
  <text x="1053" y="215" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">0</text>
  <text x="1076" y="215" font-size="15" fill="#222">otherwise</text>
</svg>
