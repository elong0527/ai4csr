<!-- Title-slide logo for this deck.
  Kept as a static <img> so `embed-resources: true` inlines it into the
  self-contained HTML; the script moves it into #title-slide right after
  the subtitle at runtime. -->
<img id="title-logo" class="title-logo" src="../assets/images/yamaa-logo.jpeg" alt="yamaa logo" />
<script>
(function () {
  function placeLogo() {
    var logo = document.getElementById("title-logo");
    var subtitle = document.querySelector("#title-slide .subtitle");
    if (logo && subtitle && logo.previousElementSibling !== subtitle) {
      subtitle.insertAdjacentElement("afterend", logo);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", placeLogo);
  } else {
    placeLogo();
  }
})();
</script>
