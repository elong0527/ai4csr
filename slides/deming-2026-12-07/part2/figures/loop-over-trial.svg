<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="lot0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>

  <!-- Column x-positions: start, 5 cycles, lock -->
  <!-- 150, 333, 516, 699, 882, 1065, 1250 -->

  <!-- Section label -->
  <text x="150" y="70" font-size="20" fill="#1565c0" font-weight="bold">Real-time benefit-risk signal finding, cycle after cycle</text>
  <text x="150" y="96" font-size="14" fill="#777">Each &#8635; is one run of the daily workflow (previous slide)</text>

  <!-- Lock milestone line, spans the whole figure, ties both halves together -->
  <path d="M 1250 60 L 1250 700" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- Timeline axis -->
  <path d="M 150 240 L 1250 240" fill="none" stroke="#444" stroke-width="2.5"/>

  <!-- Start marker -->
  <circle cx="150" cy="240" r="9" fill="#1565c0"/>
  <text x="150" y="276" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">Trial start</text>

  <!-- Loop markers -->
  <circle cx="333" cy="240" r="21" fill="#ffffff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="333" y="248" font-size="22" fill="#1565c0" text-anchor="middle" font-weight="bold">&#8635;</text>

  <!-- Signal 1: preliminary positive benefit-risk signal -->
  <circle cx="516" cy="240" r="21" fill="#ffffff" stroke="#fb8c00" stroke-width="3"/>
  <text x="516" y="248" font-size="22" fill="#e65100" text-anchor="middle" font-weight="bold">&#8635;</text>
  <path d="M 516 219 L 516 160" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="396" y="100" width="240" height="58" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="516" y="124" font-size="13.5" fill="#e65100" text-anchor="middle" font-weight="bold">&#9889; preliminary signal flagged</text>
  <text x="516" y="143" font-size="11.5" fill="#8a5a00" text-anchor="middle">early positive benefit-risk signal</text>
  <text x="516" y="158" font-size="11.5" fill="#8a5a00" text-anchor="middle">tracked cycle to cycle</text>

  <circle cx="699" cy="240" r="21" fill="#ffffff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="699" y="248" font-size="22" fill="#1565c0" text-anchor="middle" font-weight="bold">&#8635;</text>

  <circle cx="882" cy="240" r="21" fill="#ffffff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="882" y="248" font-size="22" fill="#1565c0" text-anchor="middle" font-weight="bold">&#8635;</text>

  <!-- Signal 2: reinforced, last loop before DBL, triggers DBL -->
  <circle cx="1065" cy="240" r="21" fill="#ffffff" stroke="#e65100" stroke-width="3.5"/>
  <text x="1065" y="248" font-size="22" fill="#e65100" text-anchor="middle" font-weight="bold">&#8635;</text>
  <path d="M 1065 219 L 1065 162" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="945" y="96" width="240" height="66" rx="10" fill="#ffe0b2" stroke="#e65100" stroke-width="2.5"/>
  <text x="1065" y="118" font-size="13.5" fill="#bf360c" text-anchor="middle" font-weight="bold">&#9889; signal reinforced</text>
  <text x="1065" y="137" font-size="11.5" fill="#8a5a00" text-anchor="middle">positive benefit-risk signal</text>
  <text x="1065" y="153" font-size="11.5" fill="#8a5a00" text-anchor="middle" font-weight="bold">confirmed &#8594; triggers DBL for reporting</text>

  <!-- Arrow from signal 2 to database lock, showing it triggers DBL -->
  <path d="M 1185 125 C 1210 125, 1225 160, 1235 212" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#lot0)"/>

  <text x="699" y="290" font-size="14" fill="#9aa3b2" text-anchor="middle">1&#8211;2 years of enrollment &amp; follow-up &#8212; a loop runs every day</text>

  <!-- Lock marker -->
  <circle cx="1250" cy="240" r="12" fill="#2e7d32"/>
  <text x="1250" y="276" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">Database lock</text>

  <!-- Connector verticals from axis down to bar tops -->
  <path d="M 150 249 L 150 650" fill="none" stroke="#dfe3ea" stroke-width="1.5"/>
  <path d="M 333 261 L 333 650" fill="none" stroke="#dfe3ea" stroke-width="1.5"/>
  <path d="M 516 261 L 516 650" fill="none" stroke="#dfe3ea" stroke-width="1.5"/>
  <path d="M 699 261 L 699 650" fill="none" stroke="#dfe3ea" stroke-width="1.5"/>
  <path d="M 882 261 L 882 650" fill="none" stroke="#dfe3ea" stroke-width="1.5"/>
  <path d="M 1065 261 L 1065 650" fill="none" stroke="#dfe3ea" stroke-width="1.5"/>

  <!-- Row 2 label -->
  <text x="150" y="340" font-size="20" fill="#2e7d32" font-weight="bold">TFL package &#8212; built and finalized in real time</text>
  <text x="150" y="364" font-size="14" fill="#777">Mature well before lock, not assembled from scratch after</text>

  <!-- Gridlines for % maturity, spanning full width for visual balance -->
  <path d="M 150 650 L 1250 650" fill="none" stroke="#cfd6e0" stroke-width="1.5"/>
  <path d="M 150 555 L 1250 555" fill="none" stroke="#e4e8ee" stroke-width="1" stroke-dasharray="3,4"/>
  <path d="M 150 460 L 1250 460" fill="none" stroke="#e4e8ee" stroke-width="1" stroke-dasharray="3,4"/>
  <path d="M 150 365 L 1250 365" fill="none" stroke="#cfd6e0" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Axis ticks -->
  <path d="M 114 650 L 122 650" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
  <path d="M 114 555 L 122 555" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
  <path d="M 114 460 L 122 460" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
  <path d="M 114 365 L 122 365" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="106" y="655" font-size="12" fill="#9aa3b2" text-anchor="end">0%</text>
  <text x="106" y="560" font-size="12" fill="#9aa3b2" text-anchor="end">33%</text>
  <text x="106" y="465" font-size="12" fill="#9aa3b2" text-anchor="end">66%</text>
  <text x="106" y="370" font-size="12" fill="#9aa3b2" text-anchor="end">100%</text>

  <!-- Y-axis title for the maturity bars -->
  <text x="58" y="507" font-size="13.5" fill="#2e7d32" font-weight="bold" text-anchor="middle" transform="rotate(-90 58 507)">TFL finalization completeness</text>

  <!-- Maturity bars: baseline y=650, 100% top y=365 (285px tall) -->
  <rect x="122" y="621" width="56" height="29" fill="#90caf9"/>
  <text x="150" y="608" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">10%</text>

  <rect x="305" y="579" width="56" height="71" fill="#64b5f6"/>
  <text x="333" y="566" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">25%</text>

  <rect x="488" y="536" width="56" height="114" fill="#42a5f5"/>
  <text x="516" y="523" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">40%</text>

  <rect x="671" y="479" width="56" height="171" fill="#2196f3"/>
  <text x="699" y="466" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">60%</text>

  <rect x="854" y="422" width="56" height="228" fill="#1e88e5"/>
  <text x="882" y="409" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">80%</text>

  <rect x="1037" y="389" width="56" height="261" fill="#1976d2"/>
  <text x="1065" y="376" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">92%</text>

  <rect x="1220" y="365" width="60" height="285" fill="#2e7d32"/>
  <text x="1250" y="352" font-size="15" fill="#1b5e20" text-anchor="middle" font-weight="bold">100%</text>

  <!-- Caption -->
  <text x="700" y="712" font-size="15.5" fill="#333" text-anchor="middle">A preliminary benefit-risk signal is reinforced cycle after cycle &#8212;</text>
  <text x="700" y="738" font-size="15.5" fill="#333" text-anchor="middle">once confirmed, it triggers DBL, with the TFL package already mature.</text>
</svg>
