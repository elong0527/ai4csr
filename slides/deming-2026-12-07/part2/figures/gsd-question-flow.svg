<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="qf0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="qf1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="1400" height="640" fill="#ffffff"/>

  <!-- Callout: multiplicity framework asked early -->
  <path d="M 379 120 L 379 76" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="279" y="16" width="200" height="60" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="379" y="38" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">&#9889; asked early</text>
  <text x="379" y="56" font-size="11.5" fill="#8a5a00" text-anchor="middle">shapes everything</text>
  <text x="379" y="70" font-size="11.5" fill="#8a5a00" text-anchor="middle">downstream</text>

  <!-- 6 question-cluster boxes -->
  <!-- 1 -->
  <rect x="70" y="120" width="190" height="150" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="165" y="148" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">1 &#183; Scientific</text>
  <text x="165" y="166" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">question</text>
  <text x="165" y="190" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Q1&#8211;3</text>
  <text x="165" y="214" font-size="12" fill="#555" text-anchor="middle">disease, populations,</text>
  <text x="165" y="232" font-size="12" fill="#555" text-anchor="middle">endpoints</text>

  <!-- 2 -->
  <rect x="284" y="120" width="190" height="150" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="379" y="148" font-size="14.5" fill="#e65100" text-anchor="middle" font-weight="bold">2 &#183; Multiplicity</text>
  <text x="379" y="166" font-size="14.5" fill="#e65100" text-anchor="middle" font-weight="bold">framework</text>
  <text x="379" y="190" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Q4</text>
  <text x="379" y="214" font-size="12" fill="#555" text-anchor="middle">alpha strategy,</text>
  <text x="379" y="232" font-size="12" fill="#555" text-anchor="middle">gating across hypotheses</text>

  <!-- 3 -->
  <rect x="498" y="120" width="190" height="150" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="593" y="148" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">3 &#183; Design</text>
  <text x="593" y="166" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">assumptions</text>
  <text x="593" y="190" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Q5&#8211;7</text>
  <text x="593" y="214" font-size="12" fill="#555" text-anchor="middle">randomization, control</text>
  <text x="593" y="232" font-size="12" fill="#555" text-anchor="middle">rate, effect size</text>

  <!-- 4 -->
  <rect x="712" y="120" width="190" height="150" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="807" y="148" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">4 &#183; Analysis</text>
  <text x="807" y="166" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">plan</text>
  <text x="807" y="190" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Q8&#8211;10</text>
  <text x="807" y="214" font-size="12" fill="#555" text-anchor="middle">schedule, timing,</text>
  <text x="807" y="232" font-size="12" fill="#555" text-anchor="middle">spending function</text>

  <!-- 5 -->
  <rect x="926" y="120" width="190" height="150" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="1021" y="148" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">5 &#183; Operating</text>
  <text x="1021" y="166" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">characteristics</text>
  <text x="1021" y="190" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Q11&#8211;12</text>
  <text x="1021" y="214" font-size="12" fill="#555" text-anchor="middle">power, futility</text>

  <!-- 6 -->
  <rect x="1140" y="120" width="190" height="150" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="1235" y="148" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">6 &#183; Operational</text>
  <text x="1235" y="166" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">limits</text>
  <text x="1235" y="190" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">Q13&#8211;16</text>
  <text x="1235" y="214" font-size="12" fill="#555" text-anchor="middle">enrollment, feasible N,</text>
  <text x="1235" y="232" font-size="12" fill="#555" text-anchor="middle">dropout, follow-up/gap</text>

  <!-- Arrows between boxes -->
  <path d="M 260 195 L 284 195" fill="none" stroke="#444" stroke-width="2" marker-end="url(#qf0)"/>
  <path d="M 474 195 L 498 195" fill="none" stroke="#444" stroke-width="2" marker-end="url(#qf0)"/>
  <path d="M 688 195 L 712 195" fill="none" stroke="#444" stroke-width="2" marker-end="url(#qf0)"/>
  <path d="M 902 195 L 926 195" fill="none" stroke="#444" stroke-width="2" marker-end="url(#qf0)"/>
  <path d="M 1116 195 L 1140 195" fill="none" stroke="#444" stroke-width="2" marker-end="url(#qf0)"/>

  <!-- Human-decide bracket spanning all 6 boxes -->
  <path d="M 70 288 L 70 296 L 1330 296 L 1330 288" fill="none" stroke="#c62828" stroke-width="1.5"/>
  <text x="700" y="320" font-size="15" fill="#b71c1c" text-anchor="middle" font-weight="bold">&#128100; You decide &#8212; weigh the agent's options, choose the assumptions</text>

  <!-- Arrow down to confirm box -->
  <path d="M 700 334 L 700 368" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#qf1)"/>

  <!-- Confirm box -->
  <rect x="580" y="368" width="240" height="64" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="700" y="394" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold">Confirm the table</text>
  <text x="700" y="414" font-size="11.5" fill="#777" text-anchor="middle">all inputs, one summary, before compute</text>

  <!-- Arrow down to agent-execute box -->
  <path d="M 700 432 L 700 466" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#qf0)"/>

  <!-- Agent executes box -->
  <rect x="430" y="466" width="540" height="92" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="700" y="496" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">&#129302; Agent executes</text>
  <text x="700" y="518" font-size="12.5" fill="#555" text-anchor="middle">R design script &#8594; simulation verification &#8594; Word report</text>
  <text x="700" y="538" font-size="11.5" fill="#1565c0" text-anchor="middle" font-weight="bold">deferred: the computation, not the decision</text>

  <!-- Caption -->
  <text x="700" y="600" font-size="15" fill="#333" text-anchor="middle">The order mirrors how I'd walk through a design myself &#8212; not an arbitrary intake form.</text>
  <text x="700" y="624" font-size="15" fill="#333" text-anchor="middle">I decide the assumptions and trade-offs; the agent carries out the computation.</text>
</svg>
