<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="470" viewBox="0 0 1300 470" font-family="Helvetica, Arial, sans-serif"><defs><marker id="m_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker></defs><rect width="1300" height="470" fill="#ffffff"/><text x="40" y="30" font-size="14" fill="#888" text-anchor="start" font-weight="bold">THE RECIPE: CASE STUDY III, ON ONE LAPTOP</text>
<line x1="40" y1="40" x2="600" y2="40" stroke="#bdbdbd" stroke-width="1.5"/>
<rect x="40" y="58" width="560" height="100" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
<text x="62" y="92" font-size="19" fill="#1565c0" text-anchor="start" font-weight="bold">1  Generate training data</text>
<text x="62" y="120" font-size="15.5" fill="#333" text-anchor="start">240 made-up specifications, correct by construction;</text>
<text x="62" y="142" font-size="15.5" fill="#333" text-anchor="start">none of the 17 test variables</text>
<path d="M 320 160 L 320 184" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<rect x="40" y="188" width="560" height="100" rx="12" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
<text x="62" y="222" font-size="19" fill="#e65100" text-anchor="start" font-weight="bold">2  Fine-tune a LoRA adapter</text>
<text x="62" y="250" font-size="15.5" fill="#333" text-anchor="start">Qwen2.5-3B &#183; 0.2% of the weights</text>
<text x="62" y="272" font-size="15.5" fill="#333" text-anchor="start">27 MB file &#183; 66 minutes</text>
<path d="M 320 290 L 320 314" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<rect x="40" y="318" width="560" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="62" y="352" font-size="19" fill="#1b5e20" text-anchor="start" font-weight="bold">3  Quantize to 4 bits</text>
<text x="62" y="380" font-size="15.5" fill="#333" text-anchor="start">weights 5.8 &#8594; 1.6 GB</text>
<text x="62" y="402" font-size="15.5" fill="#333" text-anchor="start">44 &#8594; 85 tokens per second</text>
<text x="680" y="30" font-size="14" fill="#888" text-anchor="start" font-weight="bold">SHARE OF THE 17 ADSL VARIABLES EXACTLY RIGHT</text>
<line x1="680" y1="40" x2="1270" y2="40" stroke="#bdbdbd" stroke-width="1.5"/>
<text x="836" y="86" font-size="15" fill="#333" text-anchor="end">16-bit base</text>
<rect x="850" y="70" width="330" height="24" rx="4" fill="#f1f3f6"/>
<rect x="850" y="70" width="52.8" height="24" rx="4" fill="#9e9e9e"/>
<text x="910.8" y="88" font-size="15" fill="#222" text-anchor="start" font-weight="bold">0.16</text>
<text x="836" y="130" font-size="15" fill="#333" text-anchor="end">16-bit + adapter</text>
<rect x="850" y="114" width="330" height="24" rx="4" fill="#f1f3f6"/>
<rect x="850" y="114" width="99.0" height="24" rx="4" fill="#fb8c00"/>
<text x="957.0" y="132" font-size="15" fill="#222" text-anchor="start" font-weight="bold">0.30</text>
<text x="836" y="174" font-size="15" fill="#333" text-anchor="end">4-bit base</text>
<rect x="850" y="158" width="330" height="24" rx="4" fill="#f1f3f6"/>
<rect x="850" y="158" width="62.7" height="24" rx="4" fill="#9e9e9e"/>
<text x="920.7" y="176" font-size="15" fill="#222" text-anchor="start" font-weight="bold">0.19</text>
<text x="836" y="218" font-size="15" fill="#333" text-anchor="end">4-bit + adapter</text>
<rect x="850" y="202" width="330" height="24" rx="4" fill="#f1f3f6"/>
<rect x="850" y="202" width="105.6" height="24" rx="4" fill="#fb8c00"/>
<text x="963.6" y="220" font-size="15" fill="#222" text-anchor="start" font-weight="bold">0.32</text>
<line x1="1180" y1="60" x2="1180" y2="248" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="1180" y="268" font-size="13.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">Haiku, structured: 1.00</text>
<rect x="680" y="292" width="285" height="112" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="698" y="318" font-size="16" fill="#1b5e20" text-anchor="start" font-weight="bold">Learned (of 10 samples)</text>
<text x="698" y="344" font-size="14.5" fill="#222" text-anchor="start">TRT01P, TRT01A: 0 &#8594; 9, 10</text>
<text x="698" y="366" font-size="14.5" fill="#222" text-anchor="start">DTHDT, AGEGR1: now 10</text>
<rect x="985" y="292" width="285" height="112" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
<text x="1003" y="318" font-size="16" fill="#b71c1c" text-anchor="start" font-weight="bold">Broke (of 10 samples)</text>
<text x="1003" y="344" font-size="14.5" fill="#222" text-anchor="start">SCRFDT 6 &#8594; 0, RANDDT 5 &#8594; 0,</text>
<text x="1003" y="366" font-size="14.5" fill="#222" text-anchor="start">RACEGR1 5 &#8594; 0: methods chosen</text>
<text x="1003" y="388" font-size="14.5" fill="#222" text-anchor="start">by look-alike training examples</text>
<text x="975" y="440" font-size="14.5" fill="#b71c1c" text-anchor="middle" font-style="italic">Validation loss 0.07 on synthetic data overstated the skill on a real specification.</text></svg>