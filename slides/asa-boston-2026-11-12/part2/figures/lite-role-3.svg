<text x="868" y="400" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">The agent writes ADAE; a QC</text>
<text x="868" y="424" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">agent writes its own; you</text>
<text x="868" y="448" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">review the 3 mismatches.</text>
