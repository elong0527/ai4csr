<text x="850" y="110" font-size="13.5" fill="#888" text-anchor="start" font-weight="bold">YOUR JOB</text>
<text x="850" y="138" font-size="18" fill="#17243b" text-anchor="start" font-weight="bold">Check, refine, reject;</text>
<text x="850" y="163" font-size="18" fill="#17243b" text-anchor="start">spend attention on</text>
<text x="850" y="188" font-size="18" fill="#17243b" text-anchor="start">the disagreements</text>
<text x="850" y="232" font-size="13.5" fill="#888" text-anchor="start" font-weight="bold">NEEDS</text>
