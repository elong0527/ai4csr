<rect x="230" y="141" width="230" height="22" rx="4" fill="#2e7d32"/>
<text x="472" y="158" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold">10/10 exact</text>
<text x="40" y="200" font-size="18" fill="#222" text-anchor="start" font-weight="bold">Haiku 5.5</text>
<text x="40" y="236" font-size="14" fill="#555" text-anchor="start">one shot</text>
<rect x="230" y="221" width="230" height="22" rx="4" fill="#f1f3f6"/>
<rect x="230" y="221" width="184" height="22" rx="4" fill="#9e9e9e"/>
<text x="472" y="238" font-size="15" fill="#555" text-anchor="start" font-weight="bold">16/20 exact</text>
<text x="40" y="276" font-size="14" fill="#555" text-anchor="start">after one error returned</text>
<rect x="230" y="261" width="230" height="22" rx="4" fill="#f1f3f6"/>
<rect x="230" y="261" width="218" height="22" rx="4" fill="#2e7d32"/>
<text x="472" y="278" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="bold">19/20 exact</text>
<text x="40" y="340" font-size="15" fill="#333" text-anchor="start">One shot: 8 of 10 Opus programs stopped on a single</text>
<text x="40" y="362" font-size="15" fill="#333" text-anchor="start">admiral argument. Returning that one message, as a</text>
<text x="40" y="384" font-size="15" fill="#333" text-anchor="start">programmer would read it, fixed every one.</text>
<text x="640" y="30" font-size="14" fill="#888" text-anchor="start" font-weight="bold">WHAT THE LOOP CAN SEE</text>
