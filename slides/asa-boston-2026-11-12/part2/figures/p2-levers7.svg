<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="540" viewBox="0 0 1300 540" font-family="Helvetica, Arial, sans-serif"><defs><marker id="m_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker></defs><rect width="1300" height="540" fill="#ffffff"/><rect x="20" y="150" width="100" height="60" rx="10" fill="#f5f5f5" stroke="#777777" stroke-width="2.5"/>
<text x="70.0" y="185.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">User</text>
<rect x="160" y="60" width="780" height="260" rx="14" fill="#faf5fc" stroke="#8e24aa" stroke-width="2.5" stroke-dasharray="8,6"/>
<text x="180" y="86" font-size="15" fill="#6a1b9a" text-anchor="start">Harness  e.g. OpenCode, Claude Code, Codex</text>
<path d="M 122 180 L 186 180" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<text x="90" y="236" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">prompt</text>
<rect x="190" y="110" width="190" height="140" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
<text x="285.0" y="155.0" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">Context</text>
<text x="285.0" y="179.0" font-size="13.5" fill="#555" text-anchor="middle">specification &#183; skills</text>
<text x="285.0" y="199.0" font-size="13.5" fill="#555" text-anchor="middle">data metadata</text>
<text x="285.0" y="219.0" font-size="13.5" fill="#555" text-anchor="middle">tool results</text>
<path d="M 382 180 L 418 180" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<rect x="422" y="115" width="180" height="130" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
<text x="512" y="150" font-size="18" fill="#e65100" text-anchor="middle" font-weight="bold">LLM</text>
<text x="512" y="176" font-size="13.5" fill="#555" text-anchor="middle">output: text, code,</text>
<text x="512" y="195" font-size="13.5" fill="#555" text-anchor="middle">or a tool call</text>
<line x1="440" y1="210" x2="584" y2="210" stroke="#ffcc80" stroke-width="1.5"/>
<text x="512" y="232" font-size="13.5" fill="#e65100" text-anchor="middle" font-weight="bold">weights</text>
<path d="M 604 180 L 640 180" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<rect x="644" y="110" width="270" height="140" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="779.0" y="155.0" font-size="17" fill="#1b5e20" text-anchor="middle" font-weight="bold">Tools</text>
<text x="779.0" y="179.0" font-size="13.5" fill="#555" text-anchor="middle">read data &#183; run R / SAS</text>
<text x="779.0" y="199.0" font-size="13.5" fill="#555" text-anchor="middle">errors returned as results</text>
<text x="779.0" y="219.0" font-size="13.5" fill="#555" text-anchor="middle">no tool can send data</text>
