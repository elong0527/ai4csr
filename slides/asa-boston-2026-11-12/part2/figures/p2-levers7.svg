<circle cx="140" cy="150" r="15" fill="#1e88e5" stroke="#fff" stroke-width="2"/>
<text x="140" y="156" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="190" cy="110" r="15" fill="#1e88e5" stroke="#fff" stroke-width="2"/>
<text x="190" y="116" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="602" cy="145" r="15" fill="#fb8c00" stroke="#fff" stroke-width="2"/>
<text x="602" y="151" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="602" cy="225" r="15" fill="#fb8c00" stroke="#fff" stroke-width="2"/>
<text x="602" y="231" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<circle cx="330" cy="292" r="15" fill="#8e24aa" stroke="#fff" stroke-width="2"/>
<text x="330" y="298" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<circle cx="160" cy="60" r="15" fill="#8e24aa" stroke="#fff" stroke-width="2"/>
<text x="160" y="66" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
<circle cx="980" cy="130" r="15" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
<text x="980" y="136" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<text x="40" y="360" font-size="14" fill="#888" text-anchor="start" font-weight="bold">SEVEN STRATEGIES, ORGANIZED BY WHAT THEY CHANGE</text>
<line x1="40" y1="370" x2="1270" y2="370" stroke="#bdbdbd" stroke-width="1.5"/>
<rect x="40" y="384" width="290" height="34" rx="8" fill="#1e88e5"/>
<text x="185.0" y="407" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">WHAT GOES IN</text>
<rect x="40" y="424" width="290" height="104" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<circle cx="64" cy="452" r="13" fill="#1e88e5" stroke="#fff" stroke-width="2"/>
<text x="64" y="458" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="86" y="450" font-size="15.5" fill="#1565c0" text-anchor="start" font-weight="bold">Complete the specification</text>
<text x="86" y="469" font-size="13" fill="#555" text-anchor="start">write the rules down</text>
<circle cx="64" cy="502" r="13" fill="#1e88e5" stroke="#fff" stroke-width="2"/>
<text x="64" y="508" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="86" y="500" font-size="15.5" fill="#1565c0" text-anchor="start" font-weight="bold">Engineer the context</text>
<text x="86" y="519" font-size="13" fill="#555" text-anchor="start">metadata, scope, conventions</text>
<rect x="353" y="384" width="290" height="34" rx="8" fill="#fb8c00"/>
<text x="498.0" y="407" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">THE MODEL</text>
<rect x="353" y="424" width="290" height="104" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<circle cx="377" cy="452" r="13" fill="#fb8c00" stroke="#fff" stroke-width="2"/>
<text x="377" y="458" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="399" y="450" font-size="15.5" fill="#e65100" text-anchor="start" font-weight="bold">Restructure the output</text>
<text x="399" y="469" font-size="13" fill="#555" text-anchor="start">ask for what tested code runs</text>
<circle cx="377" cy="502" r="13" fill="#fb8c00" stroke="#fff" stroke-width="2"/>
<text x="377" y="508" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="399" y="500" font-size="15.5" fill="#e65100" text-anchor="start" font-weight="bold">Adapt the model</text>
<text x="399" y="519" font-size="13" fill="#555" text-anchor="start">fine-tune, quantize, run locally</text>
<rect x="666" y="384" width="290" height="34" rx="8" fill="#8e24aa"/>
<text x="811.0" y="407" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">THE LOOP</text>
<rect x="666" y="424" width="290" height="104" rx="10" fill="#faf5fc" stroke="#8e24aa" stroke-width="1.5"/>
<circle cx="690" cy="452" r="13" fill="#8e24aa" stroke="#fff" stroke-width="2"/>
<text x="690" y="458" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="712" y="450" font-size="15.5" fill="#6a1b9a" text-anchor="start" font-weight="bold">Feed back checkable signals</text>
<text x="712" y="469" font-size="13" fill="#555" text-anchor="start">errors, rules, engine issues</text>
<circle cx="690" cy="502" r="13" fill="#8e24aa" stroke="#fff" stroke-width="2"/>
<text x="690" y="508" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
<text x="712" y="500" font-size="15.5" fill="#6a1b9a" text-anchor="start" font-weight="bold">Put the SOP in code</text>
<text x="712" y="519" font-size="13" fill="#555" text-anchor="start">steps that cannot be skipped</text>
<rect x="979" y="384" width="290" height="34" rx="8" fill="#2e7d32"/>
<text x="1124.0" y="407" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">WHAT COMES OUT</text>
<rect x="979" y="424" width="290" height="104" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<circle cx="1003" cy="452" r="13" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
<text x="1003" y="458" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<text x="1025" y="450" font-size="15.5" fill="#1b5e20" text-anchor="start" font-weight="bold">Check independently</text>
<text x="1025" y="469" font-size="13" fill="#555" text-anchor="start">code decides; a person signs</text></svg>