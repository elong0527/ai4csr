<text x="560" y="286" font-size="13.5" fill="#1565c0" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">result or error back into the context</text>
<path d="M 942 180 L 976 180" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<rect x="980" y="130" width="160" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="1060.0" y="165.0" font-size="17" fill="#1b5e20" text-anchor="middle" font-weight="bold">Check</text>
<text x="1060.0" y="189.0" font-size="13.5" fill="#555" text-anchor="middle">independent QC;</text>
<text x="1060.0" y="209.0" font-size="13.5" fill="#555" text-anchor="middle">code compares</text>
