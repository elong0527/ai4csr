<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="470" viewBox="0 0 1300 470" font-family="Helvetica, Arial, sans-serif"><defs><marker id="m_k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker><marker id="m_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker></defs><rect width="1300" height="470" fill="#ffffff"/><rect x="20" y="20" width="600" height="430" rx="14" fill="#fffafa" stroke="#e53935" stroke-width="2.5"/>
<text x="320" y="54" font-size="19" fill="#b71c1c" text-anchor="middle" font-weight="bold">Voting: ten programs from one small model</text>
<text x="320" y="78" font-size="14" fill="#555" text-anchor="middle" font-style="italic">Qwen2.5-3B, structured arm, Case study I</text>
<rect x="44" y="96" width="552" height="62" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
<text x="60" y="121" font-size="14.5" fill="#222" text-anchor="start">Score = cell accuracy: share of the 5,202 dataset cells</text>
<text x="60" y="144" font-size="14.5" fill="#222" text-anchor="start">(306 subjects &#215; 17 variables) that match the reference.</text>
<text x="120" y="228" font-size="44" fill="#9e9e9e" text-anchor="middle" font-weight="bold">41%</text>
<text x="120" y="258" font-size="14" fill="#555" text-anchor="middle">one program</text>
<text x="310" y="228" font-size="44" fill="#b71c1c" text-anchor="middle" font-weight="bold">38%</text>
<text x="310" y="258" font-size="14" fill="#555" text-anchor="middle">majority vote of ten,</text>
<text x="500" y="228" font-size="44" fill="#e65100" text-anchor="middle" font-weight="bold">70%</text>
<text x="500" y="258" font-size="14" fill="#555" text-anchor="middle">cells where all ten</text>
<text x="310" y="276" font-size="14" fill="#555" text-anchor="middle">per cell</text>
<text x="500" y="276" font-size="14" fill="#555" text-anchor="middle">agreed: still 30% wrong</text>
<text x="44" y="322" font-size="15" fill="#222" text-anchor="start">Why voting did not help: the ten samples come from one model</text>
<text x="44" y="346" font-size="15" fill="#222" text-anchor="start">and misread the same rules, so their errors are correlated and</text>
<text x="44" y="370" font-size="15" fill="#222" text-anchor="start">the vote repeats them. Agreement is not correctness.</text>
<text x="320" y="420" font-size="15" fill="#b71c1c" text-anchor="middle" font-weight="bold">Unlike two programmers, samples are not independent.</text>
<rect x="680" y="20" width="600" height="430" rx="14" fill="#fafffa" stroke="#2e7d32" stroke-width="2.5"/>
<text x="980" y="54" font-size="19" fill="#1b5e20" text-anchor="middle" font-weight="bold">Double programming, with code deciding</text>
<rect x="710" y="120" width="120" height="96" rx="10" fill="#f5f5f5" stroke="#777777" stroke-width="2.5"/>
<text x="770.0" y="163.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">Spec</text>
<text x="770.0" y="187.0" font-size="13.5" fill="#555" text-anchor="middle">+ data</text>
<rect x="880" y="90" width="170" height="70" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
<text x="965.0" y="120.0" font-size="15.5" fill="#e65100" text-anchor="middle" font-weight="bold">Production</text>
<text x="965.0" y="144.0" font-size="13" fill="#555" text-anchor="middle">model family A</text>
<rect x="880" y="180" width="170" height="70" rx="10" fill="#faf5fc" stroke="#8e24aa" stroke-width="2.5"/>
<text x="965.0" y="210.0" font-size="15.5" fill="#6a1b9a" text-anchor="middle" font-weight="bold">QC program</text>
<text x="965.0" y="234.0" font-size="13" fill="#555" text-anchor="middle">model family B</text>
<path d="M 832 150 L 860 150 L 860 125 L 876 125" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<path d="M 832 185 L 860 185 L 860 215 L 876 215" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<rect x="1100" y="120" width="150" height="96" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="1175.0" y="163.0" font-size="16" fill="#1b5e20" text-anchor="middle" font-weight="bold">Compare</text>
<text x="1175.0" y="187.0" font-size="13" fill="#555" text-anchor="middle">code, cell by cell</text>
<path d="M 1052 125 L 1075 125 L 1075 155 L 1096 155" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<path d="M 1052 215 L 1075 215 L 1075 185 L 1096 185" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<text x="980" y="300" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">One comparison, three jobs:</text>
<rect x="760" y="320" width="150" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="835" y="346" font-size="15.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">QC gate</text>
<rect x="930" y="320" width="150" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="1005" y="346" font-size="15.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">evaluation metric</text>
<rect x="1100" y="320" width="150" height="40" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="1175" y="346" font-size="15.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">training reward</text>
<text x="980" y="410" font-size="14" fill="#555" text-anchor="middle" font-style="italic">QC never sees the production code; a different model family is better.</text></svg>