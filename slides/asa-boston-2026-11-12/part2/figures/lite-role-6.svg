<text x="850" y="110" font-size="13.5" fill="#888" text-anchor="start" font-weight="bold">YOUR JOB</text>
<text x="850" y="138" font-size="18" fill="#17243b" text-anchor="start" font-weight="bold">Split the goal into tasks;</text>
<text x="850" y="163" font-size="18" fill="#17243b" text-anchor="start">assign agents; set the</text>
<text x="850" y="188" font-size="18" fill="#17243b" text-anchor="start">checks before work starts</text>
<text x="850" y="232" font-size="13.5" fill="#888" text-anchor="start" font-weight="bold">FAILS WHEN</text>
<text x="850" y="260" font-size="17" fill="#b71c1c" text-anchor="start">you delegate more</text>
<text x="850" y="284" font-size="17" fill="#b71c1c" text-anchor="start">than you can verify</text>
