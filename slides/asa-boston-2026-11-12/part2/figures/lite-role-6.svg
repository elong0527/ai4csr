<text x="868" y="424" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">assigned to datasets, QC</text>
<text x="868" y="448" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">rules set in advance.</text>
