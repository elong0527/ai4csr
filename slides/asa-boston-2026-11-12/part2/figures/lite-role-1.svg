<rect x="450" y="14" width="178" height="40" rx="20" fill="#f5f5f5" stroke="#d6d6d6" stroke-width="1.5"/>
<text x="539" y="40" font-size="16" fill="#9e9e9e" text-anchor="middle" font-weight="bold">Verifier</text>
<path d="M 631 34 L 651 34" fill="none" stroke="#9e9e9e" stroke-width="1.8" marker-end="url(#m_grey)"/>
<rect x="655" y="14" width="178" height="40" rx="20" fill="#f5f5f5" stroke="#d6d6d6" stroke-width="1.5"/>
<text x="744" y="40" font-size="16" fill="#9e9e9e" text-anchor="middle" font-weight="bold">Manager</text>
<path d="M 836 34 L 856 34" fill="none" stroke="#9e9e9e" stroke-width="1.8" marker-end="url(#m_grey)"/>
<rect x="860" y="14" width="178" height="40" rx="20" fill="#f5f5f5" stroke="#d6d6d6" stroke-width="1.5"/>
<text x="949" y="40" font-size="16" fill="#9e9e9e" text-anchor="middle" font-weight="bold">Editor</text>
<path d="M 1041 34 L 1061 34" fill="none" stroke="#9e9e9e" stroke-width="1.8" marker-end="url(#m_grey)"/>
<rect x="1065" y="14" width="178" height="40" rx="20" fill="#f5f5f5" stroke="#d6d6d6" stroke-width="1.5"/>
<text x="1154" y="40" font-size="16" fill="#9e9e9e" text-anchor="middle" font-weight="bold">Owner</text>
<line x1="40" y1="74" x2="1270" y2="74" stroke="#e6e6e6" stroke-width="1.5"/>
<text x="850" y="110" font-size="13.5" fill="#888" text-anchor="start" font-weight="bold">YOUR JOB</text>
<text x="850" y="138" font-size="18" fill="#17243b" text-anchor="start" font-weight="bold">Ask the question,</text>
<text x="850" y="163" font-size="18" fill="#17243b" text-anchor="start">judge the answer</text>
<text x="850" y="232" font-size="13.5" fill="#888" text-anchor="start" font-weight="bold">FAILS WHEN</text>
<text x="850" y="260" font-size="17" fill="#b71c1c" text-anchor="start">the AI knows more than you:</text>
<text x="850" y="284" font-size="17" fill="#b71c1c" text-anchor="start">a wrong answer looks just</text>
<text x="850" y="308" font-size="17" fill="#b71c1c" text-anchor="start">as convincing as a right one</text>
<rect x="850" y="345" width="420" height="132" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="868" y="372" font-size="13" fill="#8d6e00" text-anchor="start" font-weight="bold">IN STATISTICAL PROGRAMMING</text>
<text x="868" y="400" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">Ask a chatbot to write a</text>
<text x="868" y="424" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">survival analysis in R;</text>
<text x="868" y="448" font-size="16.5" fill="#5d4037" text-anchor="start" font-weight="bold">it runs and looks right.</text>
<line x1="815" y1="92" x2="815" y2="480" stroke="#eeeeee" stroke-width="1.5"/>
<line x1="60" y1="170" x2="790" y2="170" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="9,6"/>
<text x="60" y="162" font-size="13" fill="#888" text-anchor="start" font-style="italic">frontier of knowledge</text>
<rect x="520" y="110" width="150" height="100" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
<text x="595.0" y="169.0" font-size="26" fill="#e65100" text-anchor="middle" font-weight="bold">AI</text>
<path d="M 650 119 L 653 125 L 659 128 L 653 131 L 650 137 L 647 131 L 641 128 L 647 125 Z" fill="#fb8c00"/>
<circle cx="170" cy="331.4" r="19.5" fill="#385898"/>
<path d="M 138.8 393.8 Q 138.8 357.4 170 357.4 Q 201.2 357.4 201.2 393.8 Z" fill="#385898"/>
<text x="170" y="425.0" font-size="15" fill="#17243b" text-anchor="middle" font-weight="bold">Expert</text>
<path d="M 215 320 L 515 190" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<text x="330" y="238" font-size="16" fill="#17243b" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">question</text>
<path d="M 560 214 L 230 375" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#m_k)"/>
<text x="430" y="330" font-size="16" fill="#17243b" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">answer</text>
<circle cx="110" cy="250" r="34" fill="#ffebee" stroke="#e53935" stroke-width="2.5"/>
<text x="110" y="266" font-size="44" fill="#c62828" text-anchor="middle" font-weight="bold">?</text>
<text x="110" y="205" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold">right?</text>
<text x="420" y="455" font-size="16" fill="#555" text-anchor="middle" font-style="italic">The AI is above the frontier; the judge is below it.</text></svg>