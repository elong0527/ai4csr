project:
  type: book
  pre-render: scripts/build-diagrams.py
  resources:
    - CNAME
    - slides/
    - diagrams/

book:
  title: "AI-First Workflows for Clinical Study Reporting"
  author:
    - Yilong Zhang
    - Nan Xiao
  description: |
    Learn how to design trustworthy AI-first workflows for clinical study
    reporting and regulatory submission, combining agent-assisted execution,
    evidence-backed review, and accountable human decisions.

  output-file: "ai4csr"

  cover-image: "assets/cover.jpg"
  image: "assets/preview.png"
  favicon: "assets/favicon.png"

  site-url: https://ai4csr.org/
  repo-url: https://github.com/elong0527/ai4csr
  repo-actions: [edit, issue, source]
  sharing: [twitter, linkedin]
  reader-mode: true

  open-graph:
    image: assets/preview.png
  twitter-card:
    image: assets/preview.png
    card-style: summary_large_image

  chapters:
    - index.qmd
    - preface.qmd
    - part: "Principles"
      chapters:
        - ai-first-workflow.qmd
        - principle-overview.md
        - intro-ai-agent.qmd
        - workflow-rounding.qmd
    - part: "Documentation as code"
      chapters:
        - docs-overview.qmd
    - part: "Analysis and reporting"
      chapters:
        - reporting-overview.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, custom.scss]
    mainfont: "Lato, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Noto Sans, Liberation Sans, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol, Noto Color Emoji"
