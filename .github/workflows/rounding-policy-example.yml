name: Rounding policy example

on:
  pull_request:
    paths:
      - "examples/rounding/**"
      - ".github/workflows/rounding-policy-example.yml"
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    outputs:
      needs_agent: ${{ steps.gate.outputs.needs_agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Test deterministic triage
        run: Rscript examples/rounding/tests/run-tests.R
      - name: Run deterministic gate
        id: gate
        run: |
          Rscript examples/rounding/run-ci-gate.R \
            examples/rounding/fixtures/unresolved.R "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rounding-agent-queue
          path: examples/rounding/results/

  agent-handoff:
    needs: deterministic
    if: needs.deterministic.outputs.needs_agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rounding-agent-queue
      - name: Mark bounded agent handoff
        run: echo "Deterministic checks passed; unresolved calls are ready for agent review."
